# Tag-driven releases via GoReleaser, on GitHub's runners — the same shape
# lazygit and gh ship in (see .goreleaser.yaml).
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Needs a Go toolchain and nothing else: no registry, no secrets, no tailnet,
# no self-hosted runner. That last one is not a preference. The org's runner
# groups refuse public repositories — correctly, since a tailnet runner should
# not execute workflows from a repo that accepts pull requests from anyone —
# so the moment this repo went public, anything needing magpie became
# impossible rather than merely slow. Consumers that want `bm` inside an image
# take the tarball from the releases page instead (see README).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (must already exist)"
        required: true

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # goreleaser needs tags and history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet, format, test
        run: |
          set -euo pipefail
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "gofmt would change files:"; gofmt -l .; exit 1; }
          # The suite runs a real HTTP server speaking kv v2 rather than mocking
          # this package's own types, so it covers the three things that have
          # actually gone wrong here: the data/metadata segment inserted in the
          # wrong place, `.data.data` unwrapped one level short, and a 403
          # reported as a network problem. -count=1 defeats the result cache.
          go test -count=1 ./...

      # Build this runner's own target first and prove it works BEFORE anything
      # is published. `release --clean` below rebuilds everything from scratch;
      # for a dependency-free binary that is seconds, and it keeps "the smoke
      # test failed" from meaning "…and the broken release is already public".
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target -o bm-smoke

      - name: Smoke-test the runner's own binary
        run: |
          set -euo pipefail
          # A ref with no '#' must be a USAGE error (exit 2), and must say so
          # rather than crashing. Cheap, and it catches a build that produced
          # something that cannot even parse its own arguments.
          set +e
          out="$(./bm-smoke get 'bao:kv/x' 2>&1)"; code=$?
          set -e
          echo "$out"
          [ "$code" = "2" ] || { echo "expected exit 2 for a malformed ref, got $code"; exit 1; }
          ./bm-smoke --help >/dev/null
          ./bm-smoke version

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
